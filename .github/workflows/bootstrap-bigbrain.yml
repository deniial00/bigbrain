name: Bootstrap Bigbrain

on:
  push:
    branches:
      - main
    paths:
      - bigbrain.tar.gz

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish project tree
        run: |
          tar -xzf bigbrain.tar.gz
          rm -f bigbrain.tar.gz .github/workflows/bootstrap-bigbrain.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Bigbrain for OpenCode"
          git push origin HEAD:main
